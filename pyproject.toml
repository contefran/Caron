[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "caron"
version = "0.1"
description = "Caron: visualization at runtime"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
authors = [
    { name = "F. Conte" },
    { name = "G. Mattia"}
]
dependencies = [
    "numpy",
    "argparse",
    "matplotlib",
    "dearpygui",
    "numba"
]

[project.optional-dependencies]
jax = ["jax"]

[tool.setuptools.packages.find]
include = ["caron*"]


